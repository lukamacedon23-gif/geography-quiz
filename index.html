<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Geography Quiz Playable</title>
    <!-- Loads the official YouTube Playables SDK -->
    <script src="https://youtube.com"></script>
    <style>
        /* Mobile-first layout configuration */
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            width: 100%;
            max-width: 450px; /* Constraints display to phone shape on desktop */
            height: 100%;
            max-height: 800px;
            box-sizing: border-box;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #1e1e1e;
            border-radius: 12px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
        }
        .header-info {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            color: #aaaaaa;
        }
        .question-box {
            font-size: 22px;
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }
        button {
            background-color: #ff0000; /* YouTube Red theme */
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:active {
            background-color: #cc0000;
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="header-info">
            <span id="question-number">Question: 0/0</span>
            <span id="score-display">Score: 0</span>
        </div>
        <div class="question-box" id="question-text">Loading Quiz Framework...</div>
        <div class="options-container" id="options-box">
            <!-- JavaScript generates buttons here dynamically -->
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
